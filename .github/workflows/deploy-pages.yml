name: Deploy PWA to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/github-friteries-deploy-hfmtvn
  workflow_dispatch:

# Permissions requises par actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois, sans annuler celui en cours
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Prérequis (une seule fois) : Settings → Pages → Source = « GitHub Actions ».
      # Le GITHUB_TOKEN du workflow n'a pas le droit de créer le site Pages lui-même,
      # d'où cette activation manuelle unique.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # La PWA est servie telle quelle depuis la racine du dépôt
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
